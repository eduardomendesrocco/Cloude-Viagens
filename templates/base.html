<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloude Viagens</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/4.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>

    <header>
        <a href="{{ url_for('clima.home') }}" id="logo">Cloude Viagens</a>
    </header>

    <nav class="navbar bg-1 fg-2">
        <div class="container-fluid">
            {% if session.usuario_id %}
                <a class="navbar-brand" href="{{ url_for('viagens.viagens') }}">Minhas Viagens</a>
                <a class="navbar-brand" href="{{ url_for('usuarios.logout') }}">Sair</a>
            {% else %}
                <a class="navbar-brand" href="{{ url_for('usuarios.login') }}">Login</a>
            {% endif %}
        </div>
    </nav>

    {% with mensagens = get_flashed_messages(with_categories=true) %}
        {% for categoria, mensagem in mensagens %}
            <div class="alert alert-{{ categoria }} alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-diamond"></i>
                {{ mensagem }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endfor %}
    {% endwith %}

    {% block conteudo %}{% endblock conteudo %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
