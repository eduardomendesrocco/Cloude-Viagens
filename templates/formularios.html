
{% extends 'base.html' %}

{% block conteudo %}

    <div id="login">

        <h2>Entrar</h2>

        <form action="{{ url_for('usuarios.login') }}" method="POST">
            <label for="email-login"><i class="fi fi-rr-envelope"></i> E-mail: </label><br>
            <input type="email" id="email-login" name="email" placeholder="ex: ana@gmail.com" required autocomplete="email"><br>
            <label for="senha-login"> <i class="fi fi-rr-lock"></i> Senha:</label><br>
            <input type="password" id="senha-login" name="senha" required><br><br>

            <button type="submit">Entrar</button>
        </form>
        <a href="#" onclick="mostrarTela('cadastrar'); return false;">Cadastre-se</a>

    </div>

    <div id="cadastrar" hidden>

        <h2>Cadastrar</h2>

        <form action="{{ url_for('usuarios.cadastrar') }}" method="POST">
            <label for="nome"><i class="fi fi-rr-user"></i> Nome: </label><br>
            <input type="text" id="nome" name="nome" placeholder="ex: ana" required><br>

            <label for="email-cadastro"><i class="fi fi-rr-envelope"></i> E-mail</label><br>
            <input type="email" id="email-cadastro" name="email" placeholder="ex: ana@gmail.com" required autocomplete="email"><br>

            <label for="senha-cadastro"> <i class="fi fi-rr-lock"></i> Senha:</label><br>
            <input type="password" id="senha-cadastro" name="senha" placeholder='Mínimo de 8 caracteres' required><br><br>

            <button type="submit">Cadastrar-se</button>
        </form>

        <a href="#" onclick="mostrarTela('login'); return false;">Voltar ao login</a>

    </div>

    <script>
        function mostrarTela(telaEscolhida) {
            const telas = ['login', 'cadastrar'];

            telas.forEach(function(tela) {
                document.getElementById(tela).hidden =
                    tela !== telaEscolhida;
            });
        }
    </script>

{% endblock conteudo %}
