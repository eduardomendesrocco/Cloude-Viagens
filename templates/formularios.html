{% extends base.html %}

{% block conteudo %}


    <div id="login">
        <form action="{{url_for('login')}}" method="POST">
            <label for="email">E-mail</label><br>
            <input type="email" id="email" placeholder="ex: ana@gmail.com"><br>
            <label for="senha">Senha: </label>
            <input type="password" id="senha">
            <button type="submit">Entrar</button>

            <a href="{{url_for('esqueci_senha')}}">Esqueci a senha</a>
            <a href="{{url_for('cadastrar')}}">Cadastre-se</a>
        </form>
    </div>

    <div id="cadastrar" hidden>
        <form action="{{url_for('cadastrar')}}" method="POST">
            <label for="nome">Digite seu nome</label><br>
            <input type="text" id="nome" placeholder="ex: ana"><br>
            <label for="email">E-mail</label><br>
            <input type="email" id="email" placeholder="ex: ana@gmail.com"><br>
            <label for="cpf">CPF: </label>
            <input type="text" id="cpf" placeholder="123.456.789-10">
            <label for="senha">Senha: </label>
            <input type="password" id="senha">
            <button type="submit">Cadastrar-se</button>
        </form>
    </div>


{% endblock conteudo %}
